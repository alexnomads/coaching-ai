name: SEO indexing check
# Fails the commit (red X + email) if a page has a wrong/missing canonical,
# is missing from sitemap.xml, is orphaned, or a noindex/redirect page is in the sitemap.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 _tools/check_seo.py
