<div class="card">
  <div class="eyebrow">Booking confirmed</div>
  <h1>You're <em>in.</em></h1>
  <p>Your diagnostic call is booked. Check your inbox for the calendar invite and a few quick prep questions.</p>
  <p>Come with one real problem you're facing at work — we'll use it as the case study.</p>

  <div class="details" id="booking-details"></div>

  <a class="cta" href="https://aicoachalex.com/">Back to the site →</a>
</div>

<script>
  // Read booking details passed back by YouCanBookMe's redirect URL
  const params = new URLSearchParams(window.location.search);
  const name = params.get('name') || '';
  const email = params.get('email') || '';
  const bookingRef = params.get('ref') || ('booking_' + Date.now());
  // If you set a different price per page in YCBM later, pass it as &value=XX and read it here.
  const value = parseFloat(params.get('value')) || 49.00;

  if (email) {
    document.getElementById('booking-details').innerText =
      'Confirmed for: ' + (name || email);
  }

  // Push a real GA4 ecommerce purchase event.
  // This only fires on THIS page, which only loads after YouCanBookMe
  // confirms a paid booking — so this is a genuine conversion signal,
  // not just a click toward one.
  window.dataLayer = window.dataLayer || [];
  window.dataLayer.push({
    event: 'purchase',
    ecommerce: {
      transaction_id: bookingRef,
      value: value,
      currency: 'EUR',
      items: [{
        item_name: 'Clarity Call - AI Diagnostic',
        item_category: 'Coaching Session',
        price: value,
        quantity: 1
      }]
    },
    user_email: email  // only use this in GTM if you enable Enhanced/Consent-based user data; otherwise ignore
  });
</script>
